environmentConfigs:
  - environment_windows_amd64_freeze.yaml
  - environment_linux_amd64_freeze.yaml
  - environment_darwin_amd64_freeze.yaml
  - conda.yaml

pip:
  - robotframework-browser==14.1.0
  - rpaframework-core==12.0.1
  # - rpaframework-recognition==6.0.0

artifactsDir: output

PATH:
  - .
PYTHONPATH:
  - .
ignoreFiles:
  - .gitignore